name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Check shell syntax and errors
        shell: bash
        run: |
          scripts=()
          while IFS= read -r -d '' file; do
            [[ -f "$file" && ! -L "$file" ]] || continue
            IFS= read -r first < "$file" || true
            case "$first" in
              '#!'*bash*|'#!'*'/sh') scripts+=("$file") ;;
            esac
          done < <(git ls-files -z)

          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --severity=error --external-sources "${scripts[@]}"

      - name: Run fixture-only unit tests
        run: |
          OPT_JAN="$GITHUB_WORKSPACE" bats \
            test/utils/bootstrap-supervisor.bats \
            test/utils/browser-vm.bats \
            test/utils/model-presets.bats \
            test/utils/pod-subid-allocation.bats \
            test/utils/repo-policy.bats \
            test/utils/update-opt-idea-upgrade.bats \
            test/utils/update-opt-mjolnir.bats

  portable-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 bats curl unzip xz-utils zstd

      - name: Install and verify all portable tools
        run: OPT_JAN="$GITHUB_WORKSPACE" bats test/utils/update-opt-all.bats

  ansible:
    runs-on: ubuntu-latest
    env:
      # Pinned to the versions the pilot was validated against, so a new lint
      # rule or a core/interpreter change cannot alter the result without a
      # repository change.
      ANSIBLE_CORE_VERSION: "2.21.4"
      ANSIBLE_LINT_VERSION: "26.8.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ansible-core and ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ansible-core==${ANSIBLE_CORE_VERSION}" \
            "ansible-lint==${ANSIBLE_LINT_VERSION}"
          ansible --version
          ansible-lint --version

      - name: Install pinned collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint

      - name: ansible-playbook --syntax-check
        working-directory: ansible
        run: ansible-playbook -i inventory.yml --syntax-check pilot.yml
