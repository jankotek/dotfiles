name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats jq rsync shellcheck

      - name: Check shell syntax and warnings
        shell: bash
        run: |
          scripts=()
          while IFS= read -r -d '' file; do
            [[ -f "$file" && ! -L "$file" ]] || continue
            IFS= read -r first < "$file" || true
            case "$first" in
              '#!'*bash*|'#!'*'/sh') scripts+=("$file") ;;
            esac
          done < <(git ls-files -z)

          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --severity=warning --external-sources "${scripts[@]}"

      - name: Run fixture-only unit tests
        run: |
          mapfile -t tests < <(awk 'FNR == 2 && $0 == "# ci: fixture" { print FILENAME }' test/utils/*.bats)
          OPT_JAN="$GITHUB_WORKSPACE" bats "${tests[@]}"

  portable-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 bats curl unzip xz-utils zstd

      - name: Install and verify all portable tools
        run: |
          mapfile -t tests < <(awk 'FNR == 2 && $0 == "# ci: portable-tools" { print FILENAME }' test/utils/*.bats)
          OPT_JAN="$GITHUB_WORKSPACE" bats "${tests[@]}"
