---
# Phase 0 pilot: two roles only, run by setup/bootstrap inside a disposable VM.
# The shell provisioners (setup/vm-xub26, setup/vm-baseweed) are unchanged and
# remain the supported way to provision a VM.
#
# The supervisor owns the qemu-guest-agent guard for the whole run. This play
# only verifies the inherited token and never acquires or releases a lease, and
# it never touches qemu-guest-agent.service.

- name: Pilot - XDG user dirs and the tty11-root unit
  hosts: lab-vm
  gather_facts: true
  vars_files:
    - "vars/{{ ansible_facts.os_family }}.yml"

  pre_tasks:
    - name: Refuse to run outside a KVM/QEMU guest
      ansible.builtin.assert:
        that:
          - ansible_facts.virtualization_role == 'guest'
          - ansible_facts.virtualization_type in ['kvm', 'qemu']
        fail_msg: >-
          the pilot play only runs in a KVM/QEMU guest (role={{
          ansible_facts.virtualization_role }},
          type={{ ansible_facts.virtualization_type }})

    - name: Verify the guest-agent guard token inherited from the supervisor
      ansible.builtin.command:
        cmd: /usr/local/sbin/qga-guard verify {{ lookup('ansible.builtin.env', 'JAN_QGA_GUARD_TOKEN') | quote }}
      changed_when: false
      when: not ansible_check_mode

  roles:
    - role: xdg_user_dirs

    - role: systemd_units
      vars:
        systemd_units_list:
          # ACTIVATION POLICY: boot-only, as the migration plan's step 0 asks
          # for. `install-tty11-root` restarts the unit on every run and the
          # sketch permits an immediate start; the pilot does neither. The unit
          # is enabled and takes effect at the next boot, so no provisioning
          # run can ever pull a live root console out from under a session.
          - name: tty11-root
            kind: service
            enable: true
            start: false

  post_tasks:
    - name: Flush remaining handlers while still under the guard
      ansible.builtin.meta: flush_handlers
