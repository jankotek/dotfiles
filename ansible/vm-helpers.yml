---
# Roles mirroring the declarative usr/sbin helpers, run in the order the shell
# provisioners call them. This play exists to compare the roles against the
# helpers; the helpers themselves are unchanged and still the supported path.
#
# This play contains exactly what setup/vm-xub26 and setup/vm-baseweed call,
# in their order: browser VM integration, the units, console font, kernel
# cmdline, package safety, the skeleton homes, XDG directories, and
# systemd-networkd last, after every network-dependent step has finished.
# The package install/purge lists themselves are not roles yet.
#
# install-tty12-menu, install-tmp-clean and install-laptop-power are NOT
# called by the VM provisioners and live in host-helpers.yml. A tag does not
# make an unconditionally included role opt-in, and laptop_power in particular
# needs power/lid/CPU interfaces a lab guest does not have, so including it
# here made the default invocation fail before networking ever ran.
#
# The supervisor owns the qemu-guest-agent guard. This play only verifies the
# inherited token and never touches qemu-guest-agent.service.

- name: VM helper roles
  hosts: lab-vm
  gather_facts: true
  vars_files:
    - "vars/{{ ansible_facts.os_family }}.yml"

  pre_tasks:
    - name: Refuse to run outside a KVM/QEMU guest
      ansible.builtin.assert:
        that:
          - ansible_facts.virtualization_role == 'guest'
          - ansible_facts.virtualization_type in ['kvm', 'qemu']
        fail_msg: >-
          this play only runs in a KVM/QEMU guest (role={{
          ansible_facts.virtualization_role }},
          type={{ ansible_facts.virtualization_type }})
      tags: [always]

    - name: Verify the guest-agent guard token inherited from the supervisor
      ansible.builtin.command:
        cmd: /usr/local/sbin/qga-guard verify {{ lookup('ansible.builtin.env', 'JAN_QGA_GUARD_TOKEN') | quote }}
      changed_when: false
      when: not ansible_check_mode
      tags: [always]

  tasks:
    # install-chrome-vm and install-brave-vm run right after the symlink
    # farm in both provisioners, before any package work.
    - name: Browser VM integration
      ansible.builtin.include_role:
        name: browser_vm
        apply:
          tags: [browser_vm]
      tags: [browser_vm]

    - name: Install the VM console and cleanup units
      ansible.builtin.include_role:
        name: systemd_units
        apply:
          tags: [units]
      vars:
        systemd_units_list:
          # Boot-only, see ansible/README.md; install-tty11-root restarts.
          - name: tty11-root
            kind: service
            enable: true
            start: false
          # install-guest-cleanup starts it immediately and supersedes the
          # older vm-cleanup.service, which is disabled and stopped first.
          - name: guest-cleanup
            kind: service
            enable: true
            start: true
            remove:
              - vm-cleanup.service
      tags: [units]

    - name: Console font
      ansible.builtin.include_role:
        name: console_font
        apply:
          tags: [console_font]
      tags: [console_font]

    # Both provisioners wrap setup-kernel-tweaks in `|| echo WARNING
    # non-fatal`; the role fails the play instead — rerun with
    # --skip-tags kernel to proceed without it.
    - name: Kernel command-line tweaks
      ansible.builtin.include_role:
        name: kernel_cmdline
        apply:
          tags: [kernel]
      tags: [kernel]

    - name: Package manager safety
      ansible.builtin.include_role:
        name: pkg_safety
        apply:
          tags: [pkg_safety]
      tags: [pkg_safety]

    # The provisioners write user-dirs.defaults, then rsync the skeleton into
    # the primary home, then configure-user-dirs. skel before xdg_user_dirs
    # keeps that order where it matters: the synced user-dirs.dirs must
    # already exist when the role's template runs, or every run reports a
    # change.
    - name: Skeleton in /etc/skel and the primary home
      ansible.builtin.include_role:
        name: skel
        apply:
          tags: [skel]
      tags: [skel]

    - name: Lowercase XDG user directories
      ansible.builtin.include_role:
        name: xdg_user_dirs
        apply:
          tags: [xdg]
      tags: [xdg]

    - name: Networking through systemd-networkd
      ansible.builtin.include_role:
        name: vm_networkd
        apply:
          tags: [vm_networkd]
      tags: [vm_networkd]

  post_tasks:
    - name: Flush remaining handlers while still under the guard
      ansible.builtin.meta: flush_handlers
      tags: [always]
