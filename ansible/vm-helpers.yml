---
# Roles mirroring the declarative usr/sbin helpers, run in the order the shell
# provisioners call them. This play exists to compare the roles against the
# helpers; the helpers themselves are unchanged and still the supported path.
#
# Order follows setup/vm-xub26 and setup/vm-baseweed: units, console font,
# package safety, XDG directories, and systemd-networkd last, after every
# network-dependent step has finished. install-tty12-menu, install-tmp-clean
# and install-laptop-power are not called by the VM provisioners, so their
# roles sit between those two groups and carry their own tags.
#
# The supervisor owns the qemu-guest-agent guard. This play only verifies the
# inherited token and never touches qemu-guest-agent.service.

- name: VM helper roles
  hosts: lab-vm
  gather_facts: true
  vars_files:
    - "vars/{{ ansible_facts.os_family }}.yml"

  pre_tasks:
    - name: Refuse to run outside a KVM/QEMU guest
      ansible.builtin.assert:
        that:
          - ansible_facts.virtualization_role == 'guest'
          - ansible_facts.virtualization_type in ['kvm', 'qemu']
        fail_msg: >-
          this play only runs in a KVM/QEMU guest (role={{
          ansible_facts.virtualization_role }},
          type={{ ansible_facts.virtualization_type }})
      tags: [always]

    - name: Verify the guest-agent guard token inherited from the supervisor
      ansible.builtin.command:
        cmd: /usr/local/sbin/qga-guard verify {{ lookup('ansible.builtin.env', 'JAN_QGA_GUARD_TOKEN') | quote }}
      changed_when: false
      when: not ansible_check_mode
      tags: [always]

  tasks:
    - name: Console font
      ansible.builtin.include_role:
        name: console_font
      tags: [console_font]

  post_tasks:
    - name: Flush remaining handlers while still under the guard
      ansible.builtin.meta: flush_handlers
      tags: [always]
