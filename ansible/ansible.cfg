# opt-jan pilot configuration.
#
# Discovered when ansible-playbook runs with this directory as the working
# directory (setup/bootstrap does that), or via ANSIBLE_CONFIG.
#
# collections_path is deliberately NOT set here: setup/bootstrap exports
# ANSIBLE_COLLECTIONS_PATH so collections land off the (possibly host-backed,
# possibly writable) /opt/jan virtiofs share. CI uses its own venv path.

[defaults]
inventory = inventory.yml
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
host_key_checking = False
gathering = smart
stdout_callback = default
display_skipped_hosts = False
force_handlers = False

[inventory]
unparsed_is_failed = True
