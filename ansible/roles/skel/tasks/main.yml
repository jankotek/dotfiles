---
# Mirrors the skeleton payload handling in the VM provisioners:
#   /opt/jan/skel/install            -> /etc/skel  (root:root, empty dirs)
#   rsync -a skel/home/ $HOME/       -> primary home (no --delete, chown -R)
#   rsync -r home-root/ /root        -> root home  (when the source exists)
# plus the mode fixes (/home 0755, every home and /root 0700) and the
# family-specific cleanup the provisioners apply afterwards.
#
# NO --delete anywhere, exactly like the shell: a same-path file is an
# administrator override the repo replaces, but nothing the repo does not
# manage (~/down, ~/doc, ~/.cache, ...) is ever removed.
#
# This role runs BEFORE xdg_user_dirs, matching the provisioner call order.
# The home sync excludes .config/user-dirs.dirs: the skeleton copy carries an
# eight-line xdg-generated header the provisioner's configure-user-dirs
# overwrites anyway, so syncing it would fight the xdg_user_dirs template on
# every run. The exclusion keeps /etc/skel on the full skeleton file (it is
# not excluded there, matching skel/install) while xdg_user_dirs owns the
# home copy, exactly like the shell sequence.

# Dynamic include for the same reason as xdg_user_dirs: `when` must gate the
# include itself, and the inner apply: keeps the discovery running under any
# tag selection. Runs at most once per play.
- name: Discover the primary account
  ansible.builtin.include_role:
    name: primary_user
    apply:
      tags: [always]
  when: primary_user_name is not defined

- name: Ensure the skeleton destination exists
  ansible.builtin.file:
    path: /etc/skel
    state: directory
    owner: root
    group: root
    mode: "0755"

# Before the sync: creating these after it would bump /etc/skel's mtime every
# run, which the sync then "repairs" forever. With this order the directory
# settles on the first run.
- name: Create the empty skeleton directories Git cannot retain
  ansible.builtin.file:
    path: "/etc/skel/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ skel_empty_dirs }}"

# compress/delay_updates are synchronize defaults the shell's plain rsync
# does not use; disabled for parity. (-F stays on: a .rsync-filter file in
# skel/home would alter the sync, and none exists.)
- name: Install the skeleton into /etc/skel
  ansible.posix.synchronize:
    src: "{{ skel_source_dir }}/"
    dest: /etc/skel
    delete: false
    compress: false
    delay_updates: false
    rsync_opts:
      - "--chown=root:root"

# --no-owner/--no-group: the shell's `rsync -a` also propagates the checkout's
# owner and group onto every managed file and then undoes it with `chown -R`.
# Ownership policy lives in the "Repair ownership" task below, so the fight is
# dropped at the source. -p is kept, so file modes are still enforced like the
# shell's — including on the home directory itself, whose reset to the source
# mode and repair to 0700 is the residual change a converged run honestly
# reports, exactly as the shell performs it.
#
# --exclude keeps xdg_user_dirs the sole owner of ~/.config/user-dirs.dirs:
# the skeleton file has an xdg-generated header the provisioner's
# configure-user-dirs overwrites, so syncing it would fight the template.
- name: Synchronise the skeleton into the primary home
  ansible.posix.synchronize:
    src: "{{ skel_source_dir }}/"
    dest: "{{ primary_user_home }}"
    delete: false
    compress: false
    delay_updates: false
    rsync_opts:
      - "--no-owner"
      - "--no-group"
      - "--exclude=/.config/user-dirs.dirs"

- name: Look for the root-home payload
  ansible.builtin.stat:
    path: "{{ skel_home_root_dir }}"
  register: skel_home_root
  check_mode: false

# The provisioners use plain `rsync -r` here, not -a.
- name: Synchronise the root-home payload into /root
  ansible.posix.synchronize:
    src: "{{ skel_home_root_dir }}/"
    dest: /root
    delete: false
    archive: false
    recursive: true
    compress: false
    delay_updates: false
  when: skel_home_root.stat.isdir | default(false)

- name: Set home-root permissions
  ansible.builtin.file:
    path: "{{ item.0 }}"
    state: directory
    mode: "{{ item.1 }}"
  loop:
    - [/home, "0755"]
    - [/root, "0700"]

# vm-xub26 chmods every /home/*; vm-baseweed touches only the primary home.
- name: Enumerate the account homes
  ansible.builtin.find:
    paths: /home
    file_type: directory
    recurse: false
  register: skel_home_dirs
  check_mode: false
  when: skel_private_all_homes

- name: Every account home is private
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0700"
  loop: "{{ skel_home_dirs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: skel_private_all_homes

- name: The primary home is private
  ansible.builtin.file:
    path: "{{ primary_user_home }}"
    state: directory
    mode: "0700"
  when: not skel_private_all_homes

# follow: false is load-bearing, not cosmetic: the skeleton carries absolute
# symlinks out of the home (e.g. ~/.agents/skills/* -> /opt/jan/agent/skills)
# and recurse would otherwise chown those targets — the virtiofs checkout
# itself. GNU chown -R uses physical (-P) traversal and only lchowns the
# links, which is what this matches.
- name: Repair ownership of the primary home
  ansible.builtin.file:
    path: "{{ primary_user_home }}"
    state: directory
    owner: "{{ primary_user_name }}"
    group: "{{ primary_user_group }}"
    recurse: true
    follow: false

- name: Remove family-specific stale paths from the primary home
  ansible.builtin.file:
    path: "{{ primary_user_home }}/{{ item }}"
    state: absent
  loop: "{{ skel_home_absent_paths }}"
