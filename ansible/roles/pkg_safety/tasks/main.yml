---
# Mirrors usr/sbin/setup-pkg-safety: harden npm, pip, uv and gem against
# install-time code execution. go, deno and bun need no configuration.
#
# The helper's guard is per FILE, not per line: if the file already mentions
# the setting anywhere it is left completely alone, and otherwise the whole
# block is appended. Appending line by line is not the same thing and is not
# safe - an /etc/pip.conf that already has [global] followed by [download]
# would get `only-binary = :all:` appended under [download], leaving installs
# unhardened, and a uv.toml with `only-binary = false` would gain a second
# only-binary key. So the whole block is written or nothing is.

# `command -v` has no module equivalent. Following symlinks and requiring an
# executable regular file is what makes this a usable-command test rather than
# "something of that name exists somewhere in PATH": a dangling symlink or a
# directory no longer counts.
#
# One deliberate divergence, measured not assumed: bash's `command -v` reports
# a NON-executable regular file in PATH as found (POSIX sh does not), so the
# helper would write /etc/gemrc for a gem it could never run. This role treats
# that as absent.
- name: Look for the optional package managers on PATH
  ansible.builtin.stat:
    path: "{{ item.0 }}/{{ item.1 }}"
    follow: true
    get_checksum: false
  loop: "{{ (ansible_facts.env.PATH.split(':') | select | unique | list)
            | product(pkg_safety_probed_commands) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  register: pkg_safety_probe
  check_mode: false

- name: Record which optional package managers are installed
  ansible.builtin.set_fact:
    pkg_safety_present: "{{ pkg_safety_probe.results
                            | selectattr('stat.exists', 'defined')
                            | selectattr('stat.exists')
                            | selectattr('stat.isreg')
                            | selectattr('stat.executable')
                            | map(attribute='item.1') | unique | list }}"

# One read-only probe answers both "does the file exist" and "does it already
# mention the setting". It runs in check mode too, so the preview is honest.
- name: Read the existing package-manager configuration
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ pkg_safety_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: pkg_safety_existing
  failed_when: false
  check_mode: false

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.item.path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ pkg_safety_existing.results }}"
  loop_control:
    label: "{{ item.item.path | dirname }}"
  vars:
    pkg_safety_wanted: "{{ item.item.requires is not defined
                           or item.item.requires in pkg_safety_present }}"
    pkg_safety_already: "{{ (item.content | default('') | b64decode)
                            is search(item.item.key | regex_escape) }}"
  when:
    - pkg_safety_wanted | bool
    - not (pkg_safety_already | bool)

# Appending the whole block in one write, so an existing file keeps everything
# it had and gains the canonical block at the end, exactly as the helper's
# `cat >>` does. The role does normalise ownership and mode to root:root 0644,
# which the helper leaves to the existing file.
- name: Append the safety settings to the files that lack them
  ansible.builtin.copy:
    dest: "{{ item.item.path }}"
    content: "{{ (item.content | default('') | b64decode)
                 ~ (item.item.lines | join('\n')) ~ '\n' }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pkg_safety_existing.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  vars:
    pkg_safety_wanted: "{{ item.item.requires is not defined
                           or item.item.requires in pkg_safety_present }}"
    pkg_safety_already: "{{ (item.content | default('') | b64decode)
                            is search(item.item.key | regex_escape) }}"
  when:
    - pkg_safety_wanted | bool
    - not (pkg_safety_already | bool)

- name: Report the files that are already configured
  ansible.builtin.debug:
    msg: "{{ item.item.path }} already mentions {{ item.item.key }}; left alone"
  loop: "{{ pkg_safety_existing.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  vars:
    pkg_safety_wanted: "{{ item.item.requires is not defined
                           or item.item.requires in pkg_safety_present }}"
    pkg_safety_already: "{{ (item.content | default('') | b64decode)
                            is search(item.item.key | regex_escape) }}"
  when:
    - pkg_safety_wanted | bool
    - pkg_safety_already | bool
