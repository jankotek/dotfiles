---
# The helper reloads udev and acpid unconditionally; here both are tied to the
# file that makes the reload necessary.
- name: Reload the udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true

- name: Reload acpid
  ansible.builtin.systemd_service:
    name: acpid.service
    state: reloaded
  when: not ansible_check_mode
