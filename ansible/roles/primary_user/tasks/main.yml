---
# Primary-account discovery with setup/vm-baseweed's semantics:
# regular login accounts rooted directly under /home, prefer `jan`, otherwise
# require exactly one, fail on ambiguity.
#
# Shared by the roles that need the primary home (xdg_user_dirs, skel). It is
# pulled in with a dynamic include_role guarded by `primary_user_name is not
# defined` so discovery runs at most once per play; apply: tags: [always]
# keeps the included tasks running under any caller tag selection.

- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd
  check_mode: false

- name: Read the group database
  ansible.builtin.getent:
    database: group
  check_mode: false

- name: Select regular login accounts rooted directly under /home
  ansible.builtin.set_fact:
    primary_user_candidates: "{{ _home_users_json | from_json }}"
  vars:
    # getent_passwd values are [password, uid, gid, gecos, home, shell].
    _home_users_json: >-
      {% set found = [] %}
      {% for name, f in ansible_facts.getent_passwd.items() %}
      {% if f[1] | int >= 1000 and f[1] | int < 65534
            and f[4] is match('^/home/[^/]+/?$')
            and not (f[5] is search('(nologin|false)$')) %}
      {% set _ = found.append(name) %}
      {% endif %}
      {% endfor %}
      {{ found | to_json }}

- name: Require an unambiguous primary account
  ansible.builtin.assert:
    that:
      - "'jan' in primary_user_candidates or primary_user_candidates | length == 1"
    fail_msg: >-
      expected exactly one regular user under /home; found:
      {{ primary_user_candidates | join(' ') | default('(none)', true) }}
    success_msg: "primary account candidates: {{ primary_user_candidates | join(' ') }}"

- name: Resolve the primary account, its group and its home
  ansible.builtin.set_fact:
    primary_user_name: "{{ _user }}"
    primary_user_home: "{{ ansible_facts.getent_passwd[_user][4] }}"
    primary_user_group: "{{ ansible_facts.getent_group | dict2items(key_name='name', value_name='g')
                          | selectattr('g.1', 'equalto', ansible_facts.getent_passwd[_user][2])
                          | map(attribute='name') | first }}"
  vars:
    _user: "{{ 'jan' if 'jan' in primary_user_candidates else primary_user_candidates[0] }}"

- name: Stat the primary home
  ansible.builtin.stat:
    path: "{{ primary_user_home }}"
  register: primary_user_home_stat
  check_mode: false

- name: Refuse to run when the primary home is missing
  ansible.builtin.assert:
    that:
      - primary_user_home_stat.stat.isdir | default(false)
    fail_msg: "home directory does not exist: {{ primary_user_home }}"
