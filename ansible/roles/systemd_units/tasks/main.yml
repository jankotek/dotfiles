---
# Replaces the "write a unit file, daemon-reload, enable" installers in
# usr/sbin. One template per unit, service and timer kinds, and an explicit
# enable and start policy per unit.
#
# Schema, all keys required except `remove`:
#   name:    unit name without suffix
#   kind:    service | timer
#   enable:  true -> systemctl enable; false -> enablement is not touched
#            (units without an [Install] section, such as laptop-power.service
#            and laptop-power-event.service, must use false)
#   start:   true -> systemctl start (never restart; console units must not be
#            pulled out from under a live login)
#   remove:  optional list of retired unit filenames this unit supersedes;
#            each is disabled and stopped before its file is deleted

- name: Every managed unit must declare name, kind, enable and start explicitly
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.kind is defined
      - item.kind in ['service', 'timer']
      - item.enable is defined
      - item.enable is boolean
      - item.start is defined
      - item.start is boolean
      - item.remove is not defined or item.remove is sequence
    fail_msg: "invalid systemd_units_list entry: {{ item }}"
  loop: "{{ systemd_units_list }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"

# Read-only, and deliberately runs in check mode: systemd_service refuses to
# act on a unit whose file does not exist yet, so a fresh-guest preview has to
# know which units the template task is only simulating.
- name: Inspect the installed unit files
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.name }}.{{ item.kind }}"
  loop: "{{ systemd_units_list }}"
  loop_control:
    label: "{{ item.name }}.{{ item.kind }}"
  register: systemd_units_present
  check_mode: false

- name: Inspect the retired units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.1 }}"
  loop: "{{ systemd_units_list | subelements('remove', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"
  register: systemd_units_retired
  check_mode: false

# Ordering matters: a retired unit is disabled and stopped while systemd still
# knows about it, and only then is its file removed. Deleting the file first
# would leave a running process and a dangling wants-link behind.
- name: Disable and stop the retired units
  ansible.builtin.systemd_service:
    name: "{{ item.item.1 }}"
    enabled: false
    state: stopped
  loop: "{{ systemd_units_retired.results }}"
  loop_control:
    label: "{{ item.item.1 }}"
  when: item.stat.exists

- name: Remove the retired unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.item.1 }}"
    state: absent
  loop: "{{ systemd_units_retired.results }}"
  loop_control:
    label: "{{ item.item.1 }}"
  notify: Reload systemd for opt-jan managed units

- name: Install unit files
  ansible.builtin.template:
    src: "{{ item.name }}.{{ item.kind }}.j2"
    dest: "/etc/systemd/system/{{ item.name }}.{{ item.kind }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ systemd_units_list }}"
  loop_control:
    label: "{{ item.name }}.{{ item.kind }}"
  notify: Reload systemd for opt-jan managed units

- name: Reload systemd before enabling, so new units are visible
  ansible.builtin.meta: flush_handlers

# In check mode the template above only simulated the unit file, so systemd
# does not know the unit and systemd_service would fail rather than predict.
# Report the pending enable/start instead, and keep it visible in the recap.
- name: Report the enable and start deferred to a real run
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}.{{ item.item.kind }} would be
      {{ ['enabled' if item.item.enable else None, 'started' if item.item.start else None]
         | reject('none') | list | join(' and ') | default('left alone', true) }}
      once the unit file exists
  loop: "{{ systemd_units_present.results }}"
  loop_control:
    label: "{{ item.item.name }}.{{ item.item.kind }}"
  when: ansible_check_mode and not item.stat.exists
  changed_when: true

# `enable: false` means "do not touch enablement", not "disable": a unit
# without an [Install] section cannot be enabled or disabled, and the shell
# helpers never disable the units they install.
- name: Enable and start units according to their policy
  ansible.builtin.systemd_service:
    name: "{{ item.item.name }}.{{ item.item.kind }}"
    enabled: "{{ true if item.item.enable else omit }}"
    state: "{{ 'started' if item.item.start else omit }}"
  loop: "{{ systemd_units_present.results }}"
  loop_control:
    label: "{{ item.item.name }}.{{ item.item.kind }}"
  when:
    - item.item.enable or item.item.start
    - not (ansible_check_mode and not item.stat.exists)
