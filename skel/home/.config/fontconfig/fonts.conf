<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  KDE's Fonts module reads this file, not kdeglobals, to show the current
  sub-pixel and hinting settings, and it writes the file only when the user
  applies a change. A new account without it therefore shows "none" even
  though rendering is correct, so seed it to match the system defaults in
  usr/share/fontconfig/conf.avail/60-jan-subpixel.conf and the kdeglobals keys
  written by usr/sbin/setup-plasma-defaults.
-->
<fontconfig>
 <match target="pattern">
  <edit mode="assign" name="rgba"><const>rgb</const></edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="antialias"><bool>true</bool></edit>
 </match>
</fontconfig>
