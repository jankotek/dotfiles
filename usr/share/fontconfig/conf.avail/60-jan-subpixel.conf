<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Subpixel rendering for RGB-ordered LCD panels. hintslight matches the
       HintStyle the XFCE xsettings channel already requests, and lcddefault is
       the filter that keeps subpixel edges from fringing.

       Numbered above 56 deliberately. 56-user.conf includes the per-user
       fontconfig, and KDE's font KCM writes an rgba=none rule there that
       outranks any lower-numbered fragment. These are administrator defaults,
       so they are ordered to win over that stale generated file; 60 also keeps
       them beside 60-jan-jetbrains-mono.conf. openSUSE's own
       10-sub-pixel-none.conf is not the constraint: it matches target=pattern
       while these rules match target=font. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
