reasoning = on
reasoning-effort = medium
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Four concurrent 8K-token embedding slots. Inputs must remain below the slot
