; llama-server router presets
; KV cache types are chosen independently from weight quantization.
; Whisper large-v3 and official Paddle/HF safetensors are not GGUF — omitted.

[*]
jinja = true
n-gpu-layers = 99
device = Vulkan0
flash-attn = auto
sleep-idle-seconds = 300
parallel = 4

[gemma-4-E4B]
model = /var/models/gemma-4-E4B/gemma-4-E4B-it-Q8_0.gguf
mmproj = /var/models/gemma-4-E4B/mmproj-gemma-4-E4B-it-Q8_0.gguf
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gemma-4-12B]
model = /var/models/gemma-4-12B/gemma-4-12B-it-Q8_0.gguf
mmproj = /var/models/gemma-4-12B/mmproj-gemma-4-12B-it-Q8_0.gguf
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gemma-4-26B-A4B]
model = /var/models/gemma-4-26B-A4B/gemma-4-26B-A4B-it-BF16.gguf
mmproj = /var/models/gemma-4-26B-A4B/mmproj-gemma-4-26B-A4B-it-BF16.gguf
cache-type-k = bf16
cache-type-v = bf16
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[Qwen3.8-27B]
model = /var/models/Qwen3.8-27B/Qwen3.8-27B-BF16.gguf
mmproj = /var/models/Qwen3.8-27B/mmproj-Qwen3.8-27B-BF16.gguf
