; llama-server router presets
; KV cache types are chosen independently from weight quantization.
; Whisper large-v3 and official Paddle/HF safetensors are not GGUF — omitted.

[*]
jinja = true
n-gpu-layers = 99
device = Vulkan0
flash-attn = auto
sleep-idle-seconds = 300
parallel = 4

[gemma-4-E4B]
model = models/gemma-4-E4B/gemma-4-E4B-it-Q8_0.gguf
mmproj = models/gemma-4-E4B/mmproj-gemma-4-E4B-it-Q8_0.gguf
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gemma-4-12B]
model = models/gemma-4-12B/gemma-4-12B-it-Q8_0.gguf
mmproj = models/gemma-4-12B/mmproj-gemma-4-12B-it-Q8_0.gguf
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gemma-4-26B-A4B]
model = models/gemma-4-26B-A4B/gemma-4-26B-A4B-it-BF16.gguf
mmproj = models/gemma-4-26B-A4B/mmproj-gemma-4-26B-A4B-it-BF16.gguf
cache-type-k = bf16
cache-type-v = bf16
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[Qwen3.8-27B]
model = models/Qwen3.8-27B/Qwen3.8-27B-BF16.gguf
mmproj = models/Qwen3.8-27B/mmproj-Qwen3.8-27B-BF16.gguf
spec-draft-model = models/Qwen3.8-27B/mtp-Qwen3.8-27B-BF16.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
parallel = 1
cache-type-k = bf16
cache-type-v = bf16
ctx-size = 262144
reasoning = on
reasoning-effort = medium
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

[translategemma-12B]
model = models/translategemma-12B/translategemma-12b-it.Q8_0.gguf
mmproj = models/translategemma-12B/translategemma-12b-it.mmproj-f16.gguf
chat-template-file = translategemma-llamacpp.jinja
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 32768
temp = 0.0

[translategemma-27B]
model = models/translategemma-27B/translategemma-27b-it.Q8_0.gguf
mmproj = models/translategemma-27B/translategemma-27b-it.mmproj-f16.gguf
chat-template-file = translategemma-llamacpp.jinja
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 32768
temp = 0.0

[LFM2.5-2.6B]
model = models/LFM2.5-2.6B/LFM2.5-2.6B-Q8_0.gguf
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 262144
temp = 0.1
top-k = 50
top-p = 1.0
min-p = 0.0
repeat-penalty = 1.1

[PaddleOCR-VL-1.6]
model = models/PaddleOCR-VL-1.6-llama/PaddleOCR-VL-1.6-GGUF.gguf
mmproj = models/PaddleOCR-VL-1.6-llama/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
cache-type-k = f16
cache-type-v = f16
ctx-size = 131072
temp = 0.0

; Four 80k-token slots. q8_0 KV + default SWA (not swa-full).
; DFlash is the real decode speedup. Needs llama.cpp >= b10353.
[Muse-Glimmer-30B]
model = models/Muse-Glimmer-30B/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf
mmproj = models/Muse-Glimmer-30B/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
spec-draft-model = models/Muse-Glimmer-30B/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
spec-type = draft-dflash
spec-draft-n-max = 3
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 327680
flash-attn = on
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
