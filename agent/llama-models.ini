spec-type = draft-mtp
spec-draft-n-max = 3
parallel = 1
cache-type-k = bf16
cache-type-v = bf16
ctx-size = 262144
reasoning = on
reasoning-effort = medium
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Official ggml-org Q8_0 base, vision projector, and MTP predictor.
[Qwen3.8-27B-Q8_0]
