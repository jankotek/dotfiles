cache-type-v = bf16
ctx-size = 262144
reasoning = on
reasoning-effort = medium
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Q4_K_M base weights with the BF16 vision projector and MTP predictor.
; Two 160K-token slots; ctx-size is the aggregate cache capacity.
[Qwen3.8-27B-Q4_K_M]
model = /var/models/Qwen3.8-27B-GGUF-Q4_K_M/Qwen3.8-27B-Q4_K_M.gguf
