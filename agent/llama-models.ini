spec-draft-n-max = 3
spec-draft-type-k = bf16
spec-draft-type-v = bf16
parallel = 2
cache-type-k = bf16
cache-type-v = bf16
ctx-size = 327680
reasoning = on
reasoning-effort = medium
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Requires llama.cpp >= b10660 for the qwen4exp architecture.
; Start at one 32K-token slot; raise ctx-size if memory permits.
[Qwen3.8-Flash-Next-UD-Q4_K_XL]
